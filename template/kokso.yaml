- light:
    - name: "Köksö"
      state: "{{ is_state('light.kokso_knapp', 'on') and is_state('light.kokso_ledstrip_ovan', 'on') }}"
      level: "{{ state_attr('light.kokso_ledstrip_ovan', 'brightness') }}"
      temperature: "{{ state_attr('light.kokso_ledstrip_ovan', 'color_temp') }}"
      turn_on:
        - if:
            - condition: state
              entity_id: light.kokso_knapp
              state: "off"
          then:
            - action: light.turn_on
              entity_id: light.kokso_knapp
        - action: light.turn_on
          entity_id: light.kokso_ledstrip_ovan
      turn_off:
        action: light.turn_off
        entity_id: light.kokso_ledstrip_ovan
      set_level:
        action: light.turn_on
        entity_id: light.kokso_ledstrip_ovan
        data:
          brightness: "{{ brightness }}"
      set_temperature:
        action: light.turn_on
        entity_id: light.kokso_ledstrip_ovan
        data:
          color_temp: "{{ color_temp }}"
